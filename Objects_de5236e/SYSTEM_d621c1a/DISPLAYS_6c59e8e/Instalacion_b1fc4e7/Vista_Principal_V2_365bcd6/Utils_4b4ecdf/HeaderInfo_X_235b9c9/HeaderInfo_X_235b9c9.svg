 <script atv:desc="" atv:name="" type="text/ecmascript"><![CDATA[console.log("[HeaderLog] Orchestrator loading...");
      webMI.addOnload(function() {
          console.log("[HeaderLog] addOnload fired. Initializing...");
          if (typeof HeaderGlobals !== 'undefined' && HeaderGlobals.initLayout) {
              HeaderGlobals.initLayout();
          } else {
              console.log("[HeaderLog] HeaderGlobals not found. Retrying in 500ms...");
              setTimeout(function() {
                  if (typeof HeaderGlobals !== 'undefined' && HeaderGlobals.initLayout) HeaderGlobals.initLayout();
              }, 500);
          }
      });]]></script>
